name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            bin: DontStopMeNow.exe
          - os: ubuntu-latest
            name: linux-x64
            bin: DontStopMeNow
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Prueba de humo
        run: node scripts/smoke.mjs release/DontStopMeNow-${{ matrix.name }}/${{ matrix.bin }}
      - name: Comprimir (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path release/DontStopMeNow-${{ matrix.name }} -DestinationPath DontStopMeNow-${{ matrix.name }}.zip
      - name: Comprimir (Linux)
        if: runner.os == 'Linux'
        run: cd release && zip -qr ../DontStopMeNow-${{ matrix.name }}.zip DontStopMeNow-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: DontStopMeNow-${{ matrix.name }}
          path: DontStopMeNow-${{ matrix.name }}.zip

  # APK firmado de la app del celular. La clave vive en los secretos del repo: siempre la misma, así cada versión
  # se instala encima de la anterior sin perder la música bajada.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Generar el proyecto Android (expo prebuild)
        working-directory: apps/mobile
        env:
          CI: 1
        run: npx expo prebuild --platform android --no-install
      - name: Clave de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # Sin saltos de línea ni \r: un secreto cargado desde Windows puede traerlos y rompen base64.
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/release.keystore"
      - name: Compilar el APK
        working-directory: apps/mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Solo arm64-v8a: cubre los celulares de los últimos años y reduce a la mitad tiempo y tamaño.
        run: >-
          ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=arm64-v8a
          -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore"
          -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD"
          -Pandroid.injected.signing.key.alias="$KEY_ALIAS"
          -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - name: Verificar la firma
        run: |
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK" | grep -i "SHA-256"
          cp "$APK" DontStopMeNow-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DontStopMeNow-android
          path: DontStopMeNow-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.apk
          generate_release_notes: true
