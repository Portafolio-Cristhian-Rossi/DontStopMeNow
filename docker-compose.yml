services:
  dontstopmenow:
    build: .
    # Red del host: necesaria para que el celular encuentre el servidor por mDNS y para que la web de
    # gestión (que solo responde a pedidos locales) funcione al abrir http://localhost:4747 en esta máquina.
    network_mode: host
    volumes:
      # Datos del servidor (biblioteca, listas, celulares vinculados).
      - ./data:/data
      # Cambiá la ruta de la izquierda por tu carpeta de música; en la web agregala como /music.
      - /ruta/a/tu/musica:/music:ro
    restart: unless-stopped
